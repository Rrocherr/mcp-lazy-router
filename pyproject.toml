[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-lazy-router"
version = "1.0.0"
description = "Dynamic lazy-loading MCP router and TDQS tool-description optimizer with zero external dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mcp-lazy-router = "mcp_lazy_router.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
